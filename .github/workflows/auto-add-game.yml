name: Auto Add Game

on:
  repository_dispatch:
    types: [add_game_request]

jobs:
  merge-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTOMATION_GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install groq duckduckgo_search

      - name: Run merge_game.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_EVENT_PAYLOAD: ${{ toJson(github.event) }}
        run: python scripts/merge_game.py

      - name: Commit and push updated game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/
          git diff --cached --quiet || git commit -m "auto: add game from request dispatch"
          git push
