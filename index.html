<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #07070e;
      --surface:      #0e0e1c;
      --card:         #101020;
      --border:       rgba(140, 120, 255, 0.1);
      --border-hover: rgba(140, 120, 255, 0.28);
      --text:         #ddddf2;
      --muted:        #6868a0;
      --accent:       #7c3aed;
      --accent-glow:  rgba(124, 58, 237, 0.4);
      --radius:       16px;
      --header-h:     62px;
      --sidebar-w:    216px;
    }

    body.theme-light {
      --bg:           #f0f0f8;
      --surface:      #ffffff;
      --card:         #ffffff;
      --border:       rgba(80, 60, 180, 0.1);
      --border-hover: rgba(80, 60, 180, 0.3);
      --text:         #1a1a30;
      --muted:        #6060a0;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      transition: background 0.25s, color 0.25s;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -240px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 480px;
      background: radial-gradient(ellipse, rgba(124, 58, 237, 0.09) 0%, transparent 68%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 24px;
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      text-decoration: none;
      color: inherit;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
      flex-shrink: 0;
    }

    .logo-mark::after {
      content: '';
      width: 13px;
      height: 13px;
      border: 2.5px solid rgba(255,255,255,0.9);
      border-radius: 3px;
      transform: rotate(45deg);
    }

    .logo-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #ffffff 0%, rgba(180, 150, 255, 0.85) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      user-select: none;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .nav-tab {
      padding: 7px 18px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      transition: color 0.18s, background 0.18s, box-shadow 0.18s;
      white-space: nowrap;
    }

    .nav-tab:hover { color: var(--text); background: var(--surface); }

    .nav-tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 18px var(--accent-glow);
    }

    /* ── Search ── */
    .search-wrap {
      flex: 1;
      max-width: 300px;
      margin-left: auto;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 11px;
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
      line-height: 1;
    }

    .search-input {
      width: 100%;
      height: 36px;
      padding: 0 34px 0 32px;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-input::placeholder { color: var(--muted); }

    .search-clear {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px;
      display: none;
    }

    .search-clear:hover { color: var(--text); }

    /* ── Layout ── */
    .layout {
      display: flex;
      position: relative;
      z-index: 1;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: sticky;
      top: var(--header-h);
      height: calc(100vh - var(--header-h));
      overflow-y: auto;
      padding: 20px 0 40px;
      border-right: 1px solid var(--border);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .sidebar-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--muted);
      padding: 0 16px;
      margin-bottom: 8px;
    }

    .sidebar-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 16px;
      border-radius: 0;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.13s, color 0.13s;
      gap: 6px;
      font-family: inherit;
    }

    .sidebar-item:hover {
      background: var(--surface);
      color: var(--text);
    }

    .sidebar-item.highlighted {
      color: var(--text);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }

    .sidebar-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-cat {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--muted);
      opacity: 0.55;
      flex-shrink: 0;
    }

    /* ── Main ── */
    main {
      flex: 1;
      min-width: 0;
      padding: 40px 40px 80px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .game-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 11px;
      border-radius: 50px;
      letter-spacing: 0.3px;
    }

    /* ── Views ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Game Grid ── */
    .games-grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }

    body.cards-sm .games-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    body.cards-lg .games-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }

    /* ── Game Card ── */
    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      position: relative;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.28s ease,
                  border-color 0.28s ease;
    }

    .game-card:hover {
      transform: translateY(-7px);
      border-color: var(--border-hover);
      box-shadow:
        0 28px 56px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(140, 120, 255, 0.07),
        0 0 48px rgba(124, 58, 237, 0.08);
    }

    .game-card.flash {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent);
    }

    /* ── Thumbnail ── */
    .game-thumbnail {
      height: 168px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body.cards-sm .game-thumbnail { height: 130px; }
    body.cards-lg .game-thumbnail { height: 204px; }

    .thumb-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 110%, var(--g-accent, #c41230) 0%, transparent 65%);
      opacity: 0.45;
      pointer-events: none;
    }

    .thumb-noise {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: cover;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    .thumb-title {
      position: relative;
      z-index: 1;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      text-align: center;
      padding: 0 20px;
      line-height: 1.15;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.7);
    }

    body.cards-sm .thumb-title { font-size: 24px; }
    body.cards-lg .thumb-title { font-size: 40px; }

    /* ── Play overlay ── */
    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.22s ease;
      z-index: 2;
    }

    .game-card:hover .play-overlay { opacity: 1; }

    .play-btn {
      background: #fff;
      color: #111;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 12px 36px;
      border-radius: 50px;
      transform: translateY(6px) scale(0.96);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .game-card:hover .play-btn { transform: translateY(0) scale(1); }

    /* ── Card body ── */
    .game-info {
      padding: 18px 20px 20px;
      border-top: 1px solid var(--border);
    }

    .game-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    body.font-sm .game-name { font-size: 13px; }
    body.font-lg .game-name { font-size: 18px; }

    .game-desc {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    body.font-sm .game-desc { font-size: 11px; }
    body.font-lg .game-desc { font-size: 14px; }

    .game-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      padding: 3px 10px;
      border-radius: 50px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--surface);
    }

    body.font-sm .tag { font-size: 10px; }
    body.font-lg .tag { font-size: 12px; }

    /* ── State cells ── */
    .state-cell {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      color: var(--muted);
      font-size: 15px;
      gap: 16px;
      text-align: center;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Settings ── */
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .setting-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 24px 22px;
    }

    .setting-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .setting-options {
      display: flex;
      gap: 8px;
    }

    .setting-btn {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.18s, color 0.18s, background 0.18s, box-shadow 0.18s;
      text-align: center;
      white-space: nowrap;
      font-family: inherit;
    }

    .setting-btn:hover { border-color: var(--border-hover); color: var(--text); }

    .setting-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    /* ── Theme toggle ── */
    .theme-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .toggle-track {
      width: 48px;
      height: 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50px;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.22s, border-color 0.22s;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: var(--muted);
      border-radius: 50%;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.22s;
    }

    body.theme-light .toggle-track { background: var(--accent); border-color: var(--accent); }
    body.theme-light .toggle-thumb { background: #fff; transform: translateX(22px); }

    .toggle-label { font-size: 14px; font-weight: 600; color: var(--text); }

    /* ── Notice banner ── */
    .notice-banner {
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      border-radius: var(--radius);
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
    }

    .notice-banner-msg { flex: 1; }
    .notice-banner-close {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      padding: 0 2px;
      line-height: 1;
    }
    .notice-banner-close:hover { color: var(--text); }

    /* ── Responsive ── */
    @media (max-width: 960px) {
      .sidebar { display: none; }
    }

    @media (max-width: 700px) {
      .header-inner { padding: 0 14px; gap: 10px; }
      .logo-text { display: none; }
      .nav-tab { padding: 7px 12px; font-size: 12px; }
      .search-wrap { max-width: 140px; }
      main { padding: 24px 16px 60px; }
      .games-grid,
      body.cards-sm .games-grid,
      body.cards-lg .games-grid { grid-template-columns: 1fr; }
      .settings-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a class="logo" href="/">
        <div class="logo-mark"></div>
        <span class="logo-text">ARCADE</span>
      </a>
      <nav>
        <button class="nav-tab" data-tab="web">Web Ports</button>
        <button class="nav-tab" data-tab="roms">ROMs</button>
        <button class="nav-tab" data-tab="new-local">New: Local</button>
        <button class="nav-tab" data-tab="new-online">New: Online</button>
        <button class="nav-tab" data-tab="settings">Settings</button>
      </nav>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" id="searchInput" type="text" placeholder="Search games…" autocomplete="off" spellcheck="false">
        <button class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
      </div>
    </div>
  </header>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-label">All Games</div>
      <div id="sidebarList"></div>
    </aside>

    <!-- Content -->
    <main>

      <!-- Search results -->
      <div class="view" id="view-search">
        <div class="section-header">
          <h2 class="section-title">Search Results</h2>
          <span class="game-count" id="searchCount">…</span>
        </div>
        <div class="games-grid" id="searchGrid"></div>
      </div>

      <!-- Web Ports -->
      <div class="view" id="view-web">
        <div class="section-header">
          <h2 class="section-title">Web Ports</h2>
          <span class="game-count" id="webCount">…</span>
        </div>
        <div class="games-grid" id="webGrid">
          <div class="state-cell"><div class="spinner"></div>Loading…</div>
        </div>
      </div>

      <!-- New Games: Fully Local -->
      <div class="view" id="view-new-local">
        <div id="reqFailedBanner"></div>
        <div class="section-header">
          <h2 class="section-title">New Games: Fully Local</h2>
          <span class="game-count" id="newLocalCount">…</span>
        </div>
        <div class="games-grid" id="newLocalGrid">
          <div class="state-cell"><div class="spinner"></div>Loading…</div>
        </div>
      </div>

      <!-- New Games: Not Fully Local -->
      <div class="view" id="view-new-online">
        <div class="section-header">
          <h2 class="section-title">New Games: Not Fully Local</h2>
          <span class="game-count" id="newOnlineCount">…</span>
        </div>
        <div class="games-grid" id="newOnlineGrid">
          <div class="state-cell"><div class="spinner"></div>Loading…</div>
        </div>
      </div>

      <!-- ROMs -->
      <div class="view" id="view-roms">
        <div class="section-header">
          <h2 class="section-title">ROMs</h2>
          <span class="game-count" id="romCount">…</span>
        </div>
        <div class="games-grid" id="romGrid">
          <div class="state-cell"><div class="spinner"></div>Loading…</div>
        </div>
      </div>

      <!-- Settings -->
      <div class="view" id="view-settings">
        <div class="section-header">
          <h2 class="section-title">Settings</h2>
        </div>
        <div class="settings-grid">

          <div class="setting-card">
            <div class="setting-label">Theme</div>
            <div class="theme-row">
              <div class="toggle-track" id="themeToggle">
                <div class="toggle-thumb"></div>
              </div>
              <span class="toggle-label" id="toggleLabel">Dark</span>
            </div>
          </div>

          <div class="setting-card">
            <div class="setting-label">Font Size</div>
            <div class="setting-options">
              <button class="setting-btn" data-setting="font" data-value="font-sm">Small</button>
              <button class="setting-btn" data-setting="font" data-value="font-md">Medium</button>
              <button class="setting-btn" data-setting="font" data-value="font-lg">Large</button>
            </div>
          </div>

          <div class="setting-card">
            <div class="setting-label">Card Size</div>
            <div class="setting-options">
              <button class="setting-btn" data-setting="cards" data-value="cards-sm">Compact</button>
              <button class="setting-btn" data-setting="cards" data-value="cards-md">Normal</button>
              <button class="setting-btn" data-setting="cards" data-value="cards-lg">Large</button>
            </div>
          </div>

          <div class="setting-card">
            <div class="setting-label">Request an Open-Source Game</div>
            <div class="setting-options" style="flex-direction:column;gap:10px;">
              <input id="reqGameName" type="text" class="setting-btn" style="flex:none;text-align:left;cursor:text;padding:9px 12px;" placeholder="Game Name, e.g., 2048">
              <button id="reqSubmitBtn" class="setting-btn" style="flex:none;">Submit Request</button>
              <span id="reqStatus" style="font-size:12px;color:var(--muted);min-height:16px;"></span>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script>
    // ── Settings ─────────────────────────────────────────────
    const DEFAULTS = { theme: 'dark', font: 'font-md', cards: 'cards-md' };
    const FONT_CLASSES  = ['font-sm', 'font-md', 'font-lg'];
    const CARDS_CLASSES = ['cards-sm', 'cards-md', 'cards-lg'];

    let settings = { ...DEFAULTS, ...JSON.parse(localStorage.getItem('arcadeSettings') || '{}') };

    function saveSettings() { localStorage.setItem('arcadeSettings', JSON.stringify(settings)); }

    function applySettings() {
      document.body.classList.toggle('theme-light', settings.theme === 'light');
      document.getElementById('toggleLabel').textContent = settings.theme === 'light' ? 'Light' : 'Dark';
      FONT_CLASSES.forEach(c => document.body.classList.remove(c));
      document.body.classList.add(settings.font);
      CARDS_CLASSES.forEach(c => document.body.classList.remove(c));
      document.body.classList.add(settings.cards);
      document.querySelectorAll('.setting-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.value === settings[btn.dataset.setting]);
      });
    }

    applySettings();

    document.getElementById('themeToggle').addEventListener('click', () => {
      settings.theme = settings.theme === 'light' ? 'dark' : 'light';
      saveSettings(); applySettings();
    });

    document.querySelectorAll('.setting-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        settings[btn.dataset.setting] = btn.dataset.value;
        saveSettings(); applySettings();
      });
    });

    // ── Tab navigation ────────────────────────────────────────
    const tabs  = document.querySelectorAll('.nav-tab');
    const views = document.querySelectorAll('.view');

    function switchTab(tabId) {
      tabs.forEach(t  => t.classList.toggle('active', t.dataset.tab === tabId));
      views.forEach(v => v.classList.toggle('active', v.id === 'view-' + tabId));
      if (tabId !== 'search') localStorage.setItem('arcadeTab', tabId);
      highlightSidebarForTab(tabId);
    }

    tabs.forEach(tab => tab.addEventListener('click', () => {
      clearSearch();
      switchTab(tab.dataset.tab);
    }));

    // ── Search ────────────────────────────────────────────────
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    let allGames = [];

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim();
      searchClear.style.display = q ? 'block' : 'none';
      if (q) {
        runSearch(q.toLowerCase());
      } else {
        switchTab(localStorage.getItem('arcadeTab') || 'web');
      }
    });

    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') clearSearch();
    });

    searchClear.addEventListener('click', () => {
      clearSearch();
      searchInput.focus();
    });

    function clearSearch() {
      searchInput.value = '';
      searchClear.style.display = 'none';
      switchTab(localStorage.getItem('arcadeTab') || 'web');
    }

    function runSearch(q) {
      const results = allGames.filter(g =>
        g.name.toLowerCase().includes(q) ||
        g.description.toLowerCase().includes(q) ||
        g.tags.some(t => t.toLowerCase().includes(q))
      );
      tabs.forEach(t => t.classList.remove('active'));
      views.forEach(v => v.classList.toggle('active', v.id === 'view-search'));
      document.getElementById('searchCount').textContent =
        results.length + ' result' + (results.length !== 1 ? 's' : '');
      document.getElementById('searchGrid').innerHTML = results.length
        ? results.map(cardHTML).join('')
        : '<div class="state-cell">No games match your search.</div>';
      document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('highlighted'));
    }

    // ── Sidebar ───────────────────────────────────────────────
    const CAT_TAB   = { web: 'web', rom: 'roms', 'new-local': 'new-local', 'new-online': 'new-online' };
    const CAT_LABEL = { web: 'Web', rom: 'ROM', 'new-local': 'NEW', 'new-online': 'NEW' };

    function buildSidebar(games) {
      const sorted = [...games].sort((a, b) => a.name.localeCompare(b.name));
      document.getElementById('sidebarList').innerHTML = sorted.map(g => `
        <button class="sidebar-item" data-id="${g.id}" data-cat="${g.category}">
          <span class="sidebar-name">${g.name}</span>
          <span class="sidebar-cat">${CAT_LABEL[g.category] || ''}</span>
        </button>`).join('');

      document.querySelectorAll('.sidebar-item').forEach(btn => {
        btn.addEventListener('click', () => {
          clearSearch();
          const tab = CAT_TAB[btn.dataset.cat] || 'web';
          switchTab(tab);
          const cardId = 'card-' + btn.dataset.id;
          setTimeout(() => {
            const card = document.getElementById(cardId);
            if (card) {
              card.scrollIntoView({ behavior: 'smooth', block: 'center' });
              card.classList.add('flash');
              setTimeout(() => card.classList.remove('flash'), 800);
            }
          }, 60);
        });
      });
    }

    function highlightSidebarForTab(tabId) {
      document.querySelectorAll('.sidebar-item').forEach(btn => {
        const expectedTab = CAT_TAB[btn.dataset.cat] || 'web';
        btn.classList.toggle('highlighted', expectedTab === tabId && tabId !== 'settings' && tabId !== 'search' && tabId !== 'new-local' && tabId !== 'new-online');
      });
    }

    // ── Games ─────────────────────────────────────────────────
    function cardHTML(g) {
      return `
        <a class="game-card" id="card-${g.id}" href="${g.path}">
          <div class="game-thumbnail" style="background:${g.color}">
            <div class="thumb-glow" style="--g-accent:${g.accent}"></div>
            <div class="thumb-noise"></div>
            <div class="thumb-title" style="color:${g.highlight || '#fff'}">${g.name}</div>
            <div class="play-overlay"><div class="play-btn">Play Now</div></div>
          </div>
          <div class="game-info">
            <div class="game-name">${g.name}</div>
            <div class="game-desc">${g.description}</div>
            <div class="game-tags">${g.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </div>
        </a>`;
    }

    async function renderGames() {
      try {
        const { games } = await fetch('games/registry.json').then(r => r.json());
        allGames = games;

        const web       = games.filter(g => g.category === 'web');
        const rom       = games.filter(g => g.category === 'rom');
        const newLocal  = games.filter(g => g.category === 'new-local');
        const newOnline = games.filter(g => g.category === 'new-online');

        const countText = n => n + ' game' + (n !== 1 ? 's' : '');
        document.getElementById('webCount').textContent      = countText(web.length);
        document.getElementById('romCount').textContent      = countText(rom.length);
        document.getElementById('newLocalCount').textContent  = countText(newLocal.length);
        document.getElementById('newOnlineCount').textContent = countText(newOnline.length);

        document.getElementById('webGrid').innerHTML      = web.length      ? web.map(cardHTML).join('')      : '<div class="state-cell">No web ports yet.</div>';
        document.getElementById('romGrid').innerHTML      = rom.length      ? rom.map(cardHTML).join('')      : '<div class="state-cell">No ROMs yet.</div>';
        document.getElementById('newLocalGrid').innerHTML  = newLocal.length  ? newLocal.map(cardHTML).join('')  : '<div class="state-cell">No fully local games added yet.</div>';
        document.getElementById('newOnlineGrid').innerHTML = newOnline.length ? newOnline.map(cardHTML).join('') : '<div class="state-cell">No online-dependent games added yet.</div>';

        buildSidebar(games);
        switchTab(localStorage.getItem('arcadeTab') || 'web');
        loadRequestLog();

      } catch (err) {
        const msg = `<div class="state-cell">Failed to load games.<br><small style="opacity:.6">${err.message}</small></div>`;
        ['webGrid','romGrid','newLocalGrid','newOnlineGrid','searchGrid'].forEach(id => document.getElementById(id).innerHTML = msg);
        ['webCount','romCount','newLocalCount','newOnlineCount','searchCount'].forEach(id => document.getElementById(id).textContent = 'Error');
        console.error(err);
      }
    }

    async function loadRequestLog() {
      try {
        const log    = await fetch('games/request-log.json').then(r => r.json());
        const failed = log.filter(e => e.status === 'failed');
        const banner = document.getElementById('reqFailedBanner');
        if (!banner) return;
        banner.innerHTML = '';
        if (!failed.length) return;
        const names = failed.map(e => `"${e.gameName}"`).join(', ');
        banner.innerHTML = `
          <div class="notice-banner">
            <span class="notice-banner-msg">No downloadable open-source files could be found online for the following requested game(s): ${names}. These titles may not have a publicly available build.</span>
            <button class="notice-banner-close" onclick="this.closest('.notice-banner').remove()">✕</button>
          </div>`;
      } catch {}
    }

    renderGames();

    // ── Request a game ────────────────────────────────────────
    document.getElementById('reqSubmitBtn').addEventListener('click', async () => {
      const input  = document.getElementById('reqGameName');
      const status = document.getElementById('reqStatus');
      const gameName = input.value.trim();
      if (!gameName) { status.textContent = 'Please enter a game name.'; return; }

      document.getElementById('reqSubmitBtn').disabled = true;
      status.textContent = 'Processing…';

      try {
        const res = await fetch('/api/request-game', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ gameName }),
        });
        if (res.ok) {
          status.textContent = 'Success! Checking sources...';
          input.value = '';
        } else {
          const errText = await res.text();
          status.textContent = errText || `Error ${res.status}`;
        }
      } catch (err) {
        status.textContent = err.message;
      } finally {
        document.getElementById('reqSubmitBtn').disabled = false;
      }
    });
  </script>
</body>
</html>
