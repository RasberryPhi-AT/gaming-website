<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaming Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f1a;
      color: #e0e0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 3rem;
      color: #a78bfa;
      margin-bottom: 1rem;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.2rem;
      color: #94a3b8;
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .badge {
      background-color: #1e1e3a;
      border: 1px solid #a78bfa;
      color: #a78bfa;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <h1>Gaming Website</h1>
  <p>It works! This is your boilerplate landing page. Replace this content with your own to get started.</p>
  <span class="badge">LIVE</span>
</body>
</html>
