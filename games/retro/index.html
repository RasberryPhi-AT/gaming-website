<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROMs — Arcade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #07070e;
      --surface:      #0e0e1c;
      --card:         #101020;
      --border:       rgba(140, 120, 255, 0.1);
      --border-hover: rgba(140, 120, 255, 0.28);
      --text:         #ddddf2;
      --muted:        #6868a0;
      --accent:       #7c3aed;
      --accent-glow:  rgba(124, 58, 237, 0.4);
      --radius:       16px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -240px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 480px;
      background: radial-gradient(ellipse, rgba(124, 58, 237, 0.09) 0%, transparent 68%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 48px;
      height: 62px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .back-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: color 0.18s;
      flex-shrink: 0;
    }

    .back-link:hover { color: var(--text); }

    .divider {
      width: 1px;
      height: 18px;
      background: var(--border);
      flex-shrink: 0;
    }

    .page-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.3px;
    }

    /* ── Main ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 48px 80px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .game-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px 11px;
      border-radius: 50px;
      letter-spacing: 0.3px;
    }

    /* ── Game Grid ── */
    .games-grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
    }

    /* ── Game Card ── */
    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      position: relative;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.28s ease,
                  border-color 0.28s ease;
    }

    .game-card:hover {
      transform: translateY(-7px);
      border-color: var(--border-hover);
      box-shadow:
        0 28px 56px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(140, 120, 255, 0.07),
        0 0 48px rgba(124, 58, 237, 0.08);
    }

    .game-thumbnail {
      height: 168px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .thumb-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 110%, var(--g-accent) 0%, transparent 65%);
      opacity: 0.45;
      pointer-events: none;
    }

    .thumb-noise {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: cover;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    .thumb-title {
      position: relative;
      z-index: 1;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1px;
      text-align: center;
      padding: 0 20px;
      line-height: 1.15;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.7);
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.22s ease;
      z-index: 2;
    }

    .game-card:hover .play-overlay { opacity: 1; }

    .play-btn {
      background: #fff;
      color: #111;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 12px 36px;
      border-radius: 50px;
      transform: translateY(6px) scale(0.96);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .game-card:hover .play-btn { transform: translateY(0) scale(1); }

    .game-info {
      padding: 18px 20px 20px;
      border-top: 1px solid var(--border);
    }

    .game-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .game-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .game-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      padding: 3px 10px;
      border-radius: 50px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--surface);
    }

    .state-cell {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      color: var(--muted);
      font-size: 15px;
      gap: 16px;
      text-align: center;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .header-inner { padding: 0 20px; }
      main { padding: 28px 20px 60px; }
      .games-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a class="back-link" href="/">← Arcade</a>
      <div class="divider"></div>
      <span class="page-title">ROMs</span>
    </div>
  </header>

  <main>
    <div class="section-header">
      <h2 class="section-title">Games</h2>
      <span class="game-count" id="gameCount">…</span>
    </div>
    <div class="games-grid" id="grid">
      <div class="state-cell"><div class="spinner"></div>Loading…</div>
    </div>
  </main>

  <script>
    function cardHTML(g) {
      return `
        <a class="game-card" href="${g.id}/">
          <div class="game-thumbnail" style="background:${g.color}">
            <div class="thumb-glow" style="--g-accent:${g.accent}"></div>
            <div class="thumb-noise"></div>
            <div class="thumb-title" style="color:${g.highlight || '#fff'}">${g.name}</div>
            <div class="play-overlay"><div class="play-btn">Play Now</div></div>
          </div>
          <div class="game-info">
            <div class="game-name">${g.name}</div>
            <div class="game-desc">${g.description}</div>
            <div class="game-tags">${g.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </div>
        </a>`;
    }

    async function render() {
      try {
        const { games } = await fetch('../registry.json').then(r => r.json());
        const roms = games.filter(g => g.category === 'rom');

        document.getElementById('gameCount').textContent = roms.length + ' game' + (roms.length !== 1 ? 's' : '');
        document.getElementById('grid').innerHTML = roms.length
          ? roms.map(cardHTML).join('')
          : '<div class="state-cell">No ROMs yet.</div>';
      } catch (err) {
        document.getElementById('grid').innerHTML = `<div class="state-cell">Failed to load.<br><small style="opacity:.6">${err.message}</small></div>`;
        document.getElementById('gameCount').textContent = 'Error';
      }
    }

    render();
  </script>
</body>
</html>
