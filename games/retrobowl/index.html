<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta charset="utf-8" />

    <title>Clever | Portal</title>
    <link rel="icon" href="clever.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <div id="introScreen">
      <h1>hello this is hanson</h1>
      <p>
        please do not redistribute this game<br />
        as i worked very hard on to let people play it but people paid for it so
        please dont make it unfair,<br />
        thanks big bro ask me for any game you want to play and i gotchu
      </p>
      <button
        onclick="document.getElementById('introScreen').style.display = 'none'"
      >
        press if you are a good boy
      </button>
    </div>

    <style>
      body {
        background: #000;
        color: #cccccc;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      canvas {
        image-rendering: optimizeSpeed;
        -webkit-interpolation-mode: nearest-neighbor;
        -ms-touch-action: none;
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      :-webkit-full-screen #canvas {
        width: 100%;
        height: 100%;
      }
      div.gm4html5_div_class {
        margin: 0px;
        padding: 0px;
        border: 0px;
      }
      /* START - Login Dialog Box */
      div.gm4html5_login {
        padding: 20px;
        position: absolute;
        border: solid 2px #000000;
        background-color: #404040;
        color: #00ff00;
        border-radius: 15px;
        box-shadow: #101010 20px 20px 40px;
      }
      div.gm4html5_cancel_button {
        float: right;
      }
      div.gm4html5_login_button {
        float: left;
      }
      div.gm4html5_login_header {
        text-align: center;
      }
      /* END - Login Dialog Box */
      :-webkit-full-screen {
        width: 100%;
        height: 100%;
      }
    </style>
    <style id="introAutoSkipStyle">
      #introScreen,
      #introOverlay {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <img
        src="html5game/splash.png"
        id="GM4HTML5_loadingscreen"
        alt="GameMaker:HTML5 loading screen"
        style="display: none"
      />
      <!-- Create the canvas element the game draws to -->
      <canvas id="canvas" width="960" height="540">
        <p>you dont support html5 canvas so you suck get out</p>
      </canvas>
    </div>
    <script type="text/javascript" src="html5game/RetroBowl.js"></script>
    <script>
      window.onload = GameMaker_Init;
    </script>
    <script id="introAutoSkipScript">
      (function () {
        function skipIntro() {
          var intro =
            document.getElementById("introScreen") ||
            document.getElementById("introOverlay");
          var startButton =
            document.getElementById("startButton") ||
            (intro ? intro.querySelector("button") : null);
          if (startButton && typeof startButton.click === "function") {
            try {
              startButton.click();
            } catch (e) {}
          }
          if (intro) {
            intro.style.display = "none";
          }
        }

        if (document.readyState === "complete") {
          setTimeout(skipIntro, 0);
        } else {
          window.addEventListener(
            "load",
            function () {
              setTimeout(skipIntro, 0);
            },
            { once: true },
          );
        }
      })();
    </script>
  </body>
</html>
