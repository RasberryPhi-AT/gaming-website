<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOM</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script type="text/javascript" src="js-dos-api.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #121212;
      color: white;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Verdana, sans-serif;
    }
    #DOOM > .dosbox-container { width: 640px; height: 400px; }
    #DOOM > .dosbox-container > .dosbox-overlay { background: url("DOOM.png"); }
    #DOOM > .dosbox-container > .dosbox-overlay > .dosbox-start {
      border-radius: 17px;
      border: 0px solid #000000;
      background-color: rgba(90,90,90,0.57);
      padding: 5px;
      text-align: center;
      width: 10em;
      margin: 0 auto;
    }
    #fullscreen-btn {
      margin-top: 12px;
      color: white;
      cursor: pointer;
      font-size: 20px;
      text-decoration: none;
    }
    #arcadeBack {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10000;
      background: rgba(0,0,0,0.65);
      color: rgba(255,255,255,0.85);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
      opacity: 0.55;
      transition: opacity 0.2s;
    }
    #arcadeBack:hover { opacity: 1; }
  </style>
</head>
<body>
  <a href="/" id="arcadeBack">← Arcade</a>
  <div id="DOOM" class="dosbox-default"></div>
  <a id="fullscreen-btn" class="fa-solid fa-expand" title="Fullscreen"></a>
  <script type="text/javascript">
    var dosbox_DOOM = new Dosbox({
      id: "DOOM",
      onload: function(dosbox) {
        dosbox_DOOM.run("DOOM-@evilution.zip", "./DOOM/DOOM.EXE");
      },
      onrun: function(dosbox, app) {
        console.log("App '" + app + "' is runned");
      }
    });
    document.getElementById("fullscreen-btn").addEventListener("click", function() {
      dosbox_DOOM.requestFullScreen();
    });
  </script>

<!-- Arcade back button -->
<style>#arcade-back{position:fixed;top:12px;left:12px;z-index:2147483647;background:rgba(0,0,0,0.6);color:#fff;border:1.5px solid rgba(255,255,255,0.22);border-radius:8px;padding:5px 13px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0.75;transition:opacity 0.18s,background 0.18s;}#arcade-back:hover{opacity:1;background:rgba(0,0,0,0.88);}</style>
<a id="arcade-back" href="/">&#8592; Arcade</a>
</body>
</html>
