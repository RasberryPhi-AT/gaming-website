<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Slope</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading-cover">
      <div id="unity-loading-bar">
        <div id="unity-logo">
          <img src="loading.png" alt="Slope" style="max-height:120px;">
        </div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script>
    // Block window.open calls to external domains so the game cannot
    // redirect or open new tabs to trendygames.io or any other site.
    (function () {
      var _open = window.open.bind(window);
      window.open = function (url, target, features) {
        if (url && /^https?:\/\//i.test(url)) {
          console.warn('[slope] blocked window.open to:', url);
          return null;
        }
        return _open(url, target, features);
      };

      // Stub Firebase so the embedded auth plugin does nothing.
      window.firebase = {
        auth: function () {
          return {
            onAuthStateChanged: function () {},
            signInWithPopup: function () { return Promise.resolve(); },
            signOut: function () { return Promise.resolve(); },
          };
        },
        initializeApp: function () { return window.firebase; },
      };
    })();
  </script>

  <script src="slope_240615.loader.js"></script>
  <script>
    var loaderCover = document.getElementById('loading-cover');
    var progressBar = document.getElementById('unity-progress-bar-full');

    createUnityInstance(document.getElementById('unity-canvas'), {
      dataUrl:      "473b30f702395e8a0aa6b56d33bcbf14.data.unityweb",
      frameworkUrl: "a54c9e94420323b025a1d441ea133e93.js.unityweb",
      codeUrl:      "6c4f366921b11e5243a18d9dabf12f08.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName:   "Slope",
      productName:   "Slope",
      productVersion: "1.0",
    }, function(progress) {
      progressBar.style.width = (100 * progress) + '%';
    }).then(function(instance) {
      loaderCover.style.display = 'none';
    }).catch(function(msg) {
      console.error(msg);
    });
  </script>

<!-- Arcade back button -->
<style>#arcade-back{position:fixed;top:12px;left:12px;z-index:2147483647;background:rgba(0,0,0,0.6);color:#fff;border:1.5px solid rgba(255,255,255,0.22);border-radius:8px;padding:5px 13px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0.75;transition:opacity 0.18s,background 0.18s;}#arcade-back:hover{opacity:1;background:rgba(0,0,0,0.88);}</style>
<a id="arcade-back" href="/">&#8592; Arcade</a>
</body>
</html>
