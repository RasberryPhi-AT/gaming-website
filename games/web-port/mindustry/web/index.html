<!doctype html>
<html>
       <head>
              <title>Mindustry</title>
              <meta http-equiv="content-type" content="text/html; charset=UTF-8">
              <link href="styles.css" rel="stylesheet" type="text/css">
              <script src="soundmanager2-setup.js"></script>
  			  <script src="soundmanager2-jsmin.js"></script>
       </head>

       <body onkeydown="preventUseOfDefaultKeys(event);" oncontextmenu="return false;">
              <a href="/" id="arcadeBack" style="position:fixed;top:16px;left:16px;z-index:10000;background:rgba(0,0,0,0.65);color:rgba(255,255,255,0.85);padding:8px 16px;border-radius:8px;text-decoration:none;font-family:system-ui,sans-serif;font-size:13px;font-weight:600;letter-spacing:0.5px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.12);opacity:0.55;transition:opacity 0.2s">← Arcade</a>
              <style>#arcadeBack:hover{opacity:1}</style>
              <div align="center" id="embed-html"></div>
              <script type="text/javascript" src="html/html.nocache.js"></script>
       </body>
       <script>
              var keys = [27, 38, 37, 39, 40, 17, 9];

              function handleMouseDown(evt) {
                evt.preventDefault();
                evt.stopPropagation();
                evt.target.style.cursor = 'default';
                window.focus();
              }

              function handleMouseUp(evt) {
                evt.preventDefault();
                evt.stopPropagation();
                evt.target.style.cursor = '';
              }


              function preventUseOfDefaultKeys(event) {
          		 if (keys.indexOf(event.keyCode) != -1 || event.ctrlKey){
          	       event.preventDefault();
           		 }
         	  }

         	  document.getElementById('embed-html').addEventListener('mousedown', handleMouseDown, false);
              document.getElementById('embed-html').addEventListener('mouseup', handleMouseUp, false);
       </script>

</html>
