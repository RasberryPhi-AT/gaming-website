<!DOCTYPE html>
<html>
<head>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: black;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas {
  display: block;
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
}
#arcadeBack {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 10000;
  background: rgba(0,0,0,0.65);
  color: rgba(255,255,255,0.85);
  padding: 8px 16px;
  border-radius: 8px;
  text-decoration: none;
  font-family: system-ui, sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.12);
  opacity: 0.55;
  transition: opacity 0.2s;
}
#arcadeBack:hover { opacity: 1; }
</style>
</head>
<body>
  <a href="/" id="arcadeBack">← Arcade</a>
  <canvas id="floor" width="980" height="661"></canvas>
  <script src="diablo.js"></script>

<!-- Arcade back button -->
<style>#arcade-back{position:fixed;top:12px;left:12px;z-index:2147483647;background:rgba(0,0,0,0.6);color:#fff;border:1.5px solid rgba(255,255,255,0.22);border-radius:8px;padding:5px 13px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0.75;transition:opacity 0.18s,background 0.18s;}#arcade-back:hover{opacity:1;background:rgba(0,0,0,0.88);}</style>
<a id="arcade-back" href="/">&#8592; Arcade</a>
</body>
</html>
